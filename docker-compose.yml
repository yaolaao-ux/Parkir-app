services:
  db:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: parkir
      POSTGRES_USER: parkir
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./database/schema.sql:/docker-entrypoint-initdb.d/001-schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$$POSTGRES_USER\" -d \"$$POSTGRES_DB\""]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: backend/Parkir.Api/Dockerfile
    restart: unless-stopped
    environment:
      ASPNETCORE_HTTP_PORTS: 8080
      ConnectionStrings__Parking: "Host=db;Port=5432;Database=parkir;Username=parkir;Password=${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}"
      Security__ApiKey: ${API_KEY:?Set API_KEY in .env}
      Security__JwtSigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      Storage__ImageRoot: /var/lib/parkir/images
    ports:
      - "5080:8080"
    volumes:
      - api_images:/var/lib/parkir/images
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:
  api_images:
