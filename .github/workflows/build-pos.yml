name: Build POS WPF

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-pos:
    name: Build Windows POS
    runs-on: windows-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish POS
        run: dotnet publish pos/Parkir.Pos/Parkir.Pos.csproj --configuration Release --output artifacts/Parkir.Pos

      - name: Upload POS build
        uses: actions/upload-artifact@v4
        with:
          name: parkir-pos-windows
          path: artifacts/Parkir.Pos/
          if-no-files-found: error
