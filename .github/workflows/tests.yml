name: API tests

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test-api:
    name: Build and run regression tests
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build API
        run: dotnet build backend/Parkir.Api/Parkir.Api.csproj --configuration Release

      - name: Run regression tests
        run: dotnet run --project tests/Parkir.Tests/Parkir.Tests.csproj --configuration Release
