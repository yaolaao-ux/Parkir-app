name: Database smoke

on:
  push:
    branches:
      - main
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  schema:
    name: Schema and migrations
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: parkir_test
          POSTGRES_USER: parkir
          POSTGRES_PASSWORD: test-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U parkir -d parkir_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      PGPASSWORD: test-password
      DATABASE_URL: postgresql://parkir:test-password@127.0.0.1:5432/parkir_test
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Install PostgreSQL client
        run: sudo apt-get update && sudo apt-get install -y postgresql-client

      - name: Apply base schema
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/schema.sql

      - name: Apply all migrations twice
        run: |
          for file in database/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done
          for file in database/migrations/*.sql; do
            psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f "$file"
          done

      - name: Validate schema invariants
        run: psql "$DATABASE_URL" -v ON_ERROR_STOP=1 -f database/smoke.sql
